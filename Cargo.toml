[package]
name = "wasm-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Simple Wasm 3D wireframe torus UI (egui + wgpu via eframe)"

[dependencies]
egui = "0.36.0"
# eframe defaults to wgpu (WebGPU, with WebGL fallback on the web)
eframe = "0.36.0"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[profile.release]
opt-level = 2 # smaller/faster Wasm

# Keep Wasm debug builds usable in the browser
[profile.dev.package."*"]
opt-level = 2
